spring.application.name=com.team.arium

#Server
server.port=8082
server.servlet.encoding.charset=utf-8
server.servlet.encoding.force-response=true
server.servlet.encoding.enabled=true
spring.devtools.restart.enabled=true

#session셋팅 : 1800 = 30분
server.servlet.session.timeout=60m

#File
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# 멀티파트 요청 해결 시간 연장
spring.servlet.multipart.resolve-lazily=false
# 임시 파일 위치 명시
spring.servlet.multipart.location=${java.io.tmpdir}

# Tomcat 파일 업로드 설정 개선 (온프레미스 서버용)
server.tomcat.max-swallow-size=104857600
server.tomcat.max-http-form-post-size=104857600
# 커넥션 타임아웃 조정 (파일 업로드용)
server.tomcat.connection-timeout=60000
# 스레드 풀 조정 (안정성)
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
# 임시 디렉토리 정리
server.tomcat.basedir=${java.io.tmpdir}/tomcat-arium



#Thymeleaf
spring.thymeleaf.cache=false
#templates 디렉토리가 있는지 확인하는 구문 
spring.thymeleaf.check-template-location=true

spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=html
spring.thymeleaf.view-names=/*

spring.config.import=classpath:application-data.properties




# 기존 설정들은 그대로 두고 아래 내용만 추가

# ================================
# 온프레미스 서버 파일 업로드 설정
# ================================

# 파일 업로드 기본 경로
# 옵션 1: 시스템 권장 경로 (서버 관리자 설정 필요)
app.upload.base-path=/var/lib/arium/uploads

# 옵션 2: 애플리케이션 전용 경로
#app.upload.base-path=/opt/arium/uploads

# 옵션 3: 프로젝트 내 경로 (권한 있는 경우)
#app.upload.base-path=

# 옵션 4: 임시 경로 (테스트용, 재시작시 삭제됨)
#app.upload.base-path=/tmp/arium/uploads

# 웹에서 접근할 URL 접두사 (서버 IP와 포트에 맞게 수정)
app.upload.url-prefix=http://210.178.108.186:8082/uploads

# 최대 파일 크기 (바이트 단위)
app.upload.max-image-size=5242880
app.upload.max-attachment-size=10485760

# 파일 업로드 안정성 설정
app.upload.max-files-per-request=2
app.upload.connection-timeout=60000

# ================================
# 서버 관리자가 실행해야 할 명령어들
# ================================
# 
# 1. 업로드 디렉토리 생성:
#    sudo mkdir -p /var/lib/arium/uploads
#    sudo mkdir -p /var/lib/arium/uploads/program-images  
#    sudo mkdir -p /var/lib/arium/uploads/attachments
#
# 2. 소유권 변경 (애플리케이션 실행 사용자로):
#    sudo chown -R [앱실행사용자]:[앱실행그룹] /var/lib/arium/
#    예: sudo chown -R tomcat:tomcat /var/lib/arium/
#    예: sudo chown -R arium:arium /var/lib/arium/
#
# 3. 권한 설정:
#    sudo chmod -R 755 /var/lib/arium/uploads/
#
# 4. SELinux 사용시 (CentOS/RHEL):
#    sudo setsebool -P httpd_can_network_connect 1
#    sudo semanage fcontext -a -t httpd_exec_t "/var/lib/arium/uploads(/.*)?"
#    sudo restorecon -R /var/lib/arium/uploads/
#
# ================================