<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org/">

<!-- 마일리지 지급 상세 뷰 영역 -->
<div th:fragment="mileage_payment_add_view" class="main-content">
    <!-- 프로그램 정보 섹션 -->
    <div class="program-info-section">
        <div class="program-info-header">
            프로그램 정보
        </div>
        <div class="program-info-content" id="programInfoContent">
            <div class="program-title" id="programTitle">프로그램 정보를 불러오는 중...</div>
            <div class="program-period" id="programPeriod">-</div>
            <div class="program-details">
                <div class="program-participants" id="programParticipants">인원 - 명</div>
                <div class="program-mileage" id="programMileage">마일리지 - 점</div>
            </div>
        </div>
    </div>

    <!-- 신청자 리스트 섹션 -->
    <div class="applicant-section">
        <div class="applicant-header">
            <span id="applicantListTitle">신청자 리스트</span>
            <button class="bulk-payment-btn" onclick="bulkPayment()" id="bulkPaymentBtn">
                <i class="fas fa-coins"></i> 전체 지급
            </button>
        </div>

        <!-- 테이블 -->
        <div class="table-container">
            <table class="applicant-table">
                <thead>
                    <tr>
                        <th class="col-no">NO</th>
                        <th class="col-student-id">학번</th>
                        <th class="col-name">이름</th>
                        <th class="col-department">학과</th>
                        <th class="col-completion">이수여부</th>
                        <th class="col-satisfaction">만족도 여부</th>
                        <th class="col-payment">지급</th>
                    </tr>
                </thead>
                <tbody id="applicantTableBody">
                    <!-- 데이터가 여기에 동적으로 추가됩니다 -->
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 20px;">
                            <i class="fas fa-spinner fa-spin"></i> 데이터를 불러오는 중...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 하단 버튼 영역 -->
    <div class="bottom-actions">
        <button class="list-btn" onclick="goToList()">
            <i class="fas fa-list"></i> 목록
        </button>
    </div>
</div>

</html>
