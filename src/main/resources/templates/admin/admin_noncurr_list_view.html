<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org/">

<body>
 <!-- 비교과 목록 뷰 영역 -->
 <div th:fragment="noncurr_list_view" class="main-container">
    <!-- 페이지 제목 -->
    <h1 class="page-title">비교과 목록</h1>
    <div class="title-divider"></div>

    <!-- 필터 및 검색 영역 -->
    <div class="filter-section">
        <div class="filter-row">
            <div class="search-area">
                <select class="search-type-select" id="searchType">
                    <option value="prgNm">프로그램명</option>
                    <option value="department">운영부서</option>
                </select>
                <input type="text" class="search-input" id="searchKeyword" placeholder="검색어를 입력하세요">
                <button class="search-btn" onclick="searchPrograms()">
                    <i class="fas fa-search"></i> 검색
                </button>
            </div>
            
            <div class="filter-left">
                <label class="filter-label">기간</label>
                <select class="filter-select" id="periodFilter">
                    <option value="">전체</option>
                    <option value="2025">2025년</option>
                    <option value="2024">2024년</option>
                    <option value="2023">2023년</option>
                </select>
                
                <label class="filter-label">상태</label>
                <select class="filter-select" id="statusFilter">
                    <option value="">전체</option>
                    <option value="open">오픈</option>
                    <option value="pro">진행</option>
                    <option value="completed">완료</option>
                    <option value="full">인원 마감</option>
                </select>
            </div>
            
            <button class="register-btn" onclick="registerProgram()">
                <span class="material-symbols-outlined">add</span>
                비교과 등록
            </button>
        </div>
    </div>

    <!-- 테이블 영역 -->
    <div class="table-container">
        <div class="table-content">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">No</th>
                        <th style="width: calc(100% - 750px);">프로그램 명</th>
                        <th style="width: 120px;">운영부서</th>
                        <th style="width: 150px;">모집기간</th>
                        <th style="width: 80px;">모집인원</th>
                        <th style="width: 150px;">운영기간</th>
                        <th style="width: 140px;">상태</th>
                    </tr>
                </thead>
                <tbody id="programTableBody">
                    <!-- 데이터가 동적으로 삽입됩니다 -->
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 20px; color: #666;">
                            <i class="fas fa-spinner fa-spin"></i> 데이터를 불러오는 중...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- 페이징 -->
        <div class="pagination-container">
            <nav aria-label="Page navigation">
                <ul class="pagination" id="pagination">
                    <li class="page-item disabled">
                        <a class="page-link page-arrow" href="#" aria-label="Previous">
                            <i class="fas fa-angle-left"></i>
                        </a>
                    </li>
                    <li class="page-item active">
                        <a class="page-link" href="#">1</a>
                    </li>
                    <li class="page-item disabled">
                        <a class="page-link page-arrow" href="#" aria-label="Next">
                            <i class="fas fa-angle-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="pagination-info" id="paginationInfo">
                총 0건 중 0-0건 표시
            </div>
        </div>
    </div>
 </div>

 <!-- JavaScript 포함 -->
 <script th:src="@{/js/admin/admin_noncurr_list.js}"></script>
</body>
</html>
