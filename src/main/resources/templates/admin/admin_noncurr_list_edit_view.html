<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org/">

<body>
    <!-- 비교과 수정 페이지 뷰 -->
    <div th:fragment="noncurr_edit_view" class="main-container">
        <!-- 페이지 제목 -->
        <div class="page-header">
            <h1 class="page-title">비교과 수정</h1>
            <button class="btn-list" onclick="goToList()">
                <span class="material-symbols-outlined">list</span>
                목록으로
            </button>
        </div>
        <div class="title-divider"></div>

        <!-- 폼 전체 감싸기 -->
        <form id="programForm" th:action="@{/admin/noncurr_edit}" method="post" enctype="multipart/form-data">
            <!-- ✅ 프로그램 ID 히든 필드 -->
            <input type="hidden" id="prgId" name="prgId" th:value="${formDto != null ? formDto.prgId : ''}" />
            
            <!-- 등록 폼 섹션 - 등록 페이지와 동일한 구조 -->
            <div class="register-form-section">
                <!-- 대표 사진 영역 -->
                <div class="program-image-section">
                    <label class="form-label required">프로그램 대표 사진</label>
                    <div class="image-upload-area">
                        <input type="file" id="imageFile" name="imageFile" accept="image/*" onchange="handleImageSelect(this)">
                        <!-- ✅ 기존 이미지가 있으면 표시, 없으면 기본 콘텐츠 표시 -->
                        <div th:if="${formDto == null or formDto.imageUrl == null}" class="image-upload-content">
                            <i class="fas fa-camera"></i>
                            <div>대표 사진 업로드</div>
                            <small>클릭하여 선택</small>
                        </div>
                        <img th:if="${formDto != null and formDto.imageUrl != null}" 
                             th:src="@{${formDto.imageUrl}}" 
                             alt="기존 대표 사진" 
                             class="image-preview" 
                             style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;">
                    </div>
                    <div class="image-info">
                        • 권장 크기: 400×300px<br>
                        • 파일 형식: JPG, PNG<br>
                        • 최대 크기: 5MB
                    </div>
                </div>

                <!-- 폼 컨텐츠 영역 -->
                <div class="form-content-section">
                    <!-- ✅ 히든 필드들 -->
                    <input type="hidden" id="competencyIdsStr" name="competencyIdsStr" value="">
                    <input type="hidden" id="competencyScoresStr" name="competencyScoresStr" value="">
                    <input type="hidden" id="prgStatCd" name="prgStatCd" value="51">
                    
                    <div class="form-grid">
                        <!-- ✅ 비교과명 -->
                        <div class="form-item full-width">
                            <label class="form-label required">비교과명</label>
                            <input type="text" class="form-input" id="prgNm" name="prgNm" 
                                   th:value="${formDto != null ? formDto.prgNm : ''}"
                                   placeholder="비교과 프로그램명을 입력하세요" required>
                        </div>

                        <!-- ✅ 모집기간 -->
                        <div class="form-item">
                            <label class="form-label required">모집 시작일</label>
                            <input type="date" class="form-input" id="recruitStDt" name="recruitStDt" 
                                   th:value="${formDto != null ? (#strings.substring(formDto.recruitStDt, 0, 10)) : ''}" required>
                        </div>

                        <div class="form-item">
                            <label class="form-label required">모집 마감일</label>
                            <input type="date" class="form-input" id="recruitEndDt" name="recruitEndDt" 
                                   th:value="${formDto != null ? (#strings.substring(formDto.recruitEndDt, 0, 10)) : ''}" required>
                        </div>

                        <!-- ✅ 모집인원 -->
                        <div class="form-item">
                            <label class="form-label required">모집인원</label>
                            <input type="number" class="form-input" id="maxCnt" name="maxCnt" 
                                   th:value="${formDto != null ? formDto.maxCnt : ''}"
                                   placeholder="30" min="1" required>
                        </div>

                        <!-- ✅ 운영부서 -->
                        <div class="form-item">
                            <label class="form-label required">운영부서</label>
                            <select class="form-input" id="prgDept" name="prgDept" required>
                                <option value="">선택하세요</option>
                                <option value="교양학부" th:selected="${formDto != null and formDto.prgDept == '교양학부'}">교양학부</option>
                                <option value="취업지원처" th:selected="${formDto != null and formDto.prgDept == '취업지원처'}">취업지원처</option>
                                <option value="정보과학과" th:selected="${formDto != null and formDto.prgDept == '정보과학과'}">정보과학과</option>
                                <option value="학생처" th:selected="${formDto != null and formDto.prgDept == '학생처'}">학생처</option>
                                <option value="창업지원센터" th:selected="${formDto != null and formDto.prgDept == '창업지원센터'}">창업지원센터</option>
                                <option value="학습지원센터" th:selected="${formDto != null and formDto.prgDept == '학습지원센터'}">학습지원센터</option>
                                <option value="사회봉사센터" th:selected="${formDto != null and formDto.prgDept == '사회봉사센터'}">사회봉사센터</option>
                                <option value="연구처" th:selected="${formDto != null and formDto.prgDept == '연구처'}">연구처</option>
                                <option value="컴퓨터과학과" th:selected="${formDto != null and formDto.prgDept == '컴퓨터과학과'}">컴퓨터과학과</option>
                            </select>
                        </div>

                        <!-- ✅ 운영기간 -->
                        <div class="form-item">
                            <label class="form-label required">운영 시작일</label>
                            <input type="date" class="form-input" id="prgStDt" name="prgStDt" 
                                   th:value="${formDto != null ? (#strings.substring(formDto.prgStDt, 0, 10)) : ''}" required>
                        </div>

                        <div class="form-item">
                            <label class="form-label required">운영 종료일</label>
                            <input type="date" class="form-input" id="prgEndDt" name="prgEndDt" 
                                   th:value="${formDto != null ? (#strings.substring(formDto.prgEndDt, 0, 10)) : ''}" required>
                        </div>

                        <!-- ✅ 문의 전화번호 -->
                        <div class="form-item">
                            <label class="form-label required">문의 전화번호</label>
                            <input type="tel" class="form-input" id="prgTel" name="prgTel" 
                                   th:value="${formDto != null ? formDto.prgTel : ''}"
                                   placeholder="02-3668-4321" required>
                        </div>

                        <!-- ✅ 만족도조사 마감일 -->
                        <div class="form-item">
                            <label class="form-label required">만족도조사 마감일</label>
                            <input type="date" class="form-input" id="surveyDt" name="surveyDt" 
                                   th:value="${formDto != null ? (#strings.substring(formDto.surveyDt, 0, 10)) : ''}" required>
                        </div>

                        <!-- ✅ 마일리지 점수 -->
                        <div class="form-item">
                            <label class="form-label required">마일리지 점수</label>
                            <input type="number" class="form-input" id="mlgDefScore" name="mlgDefScore" 
                                   th:value="${formDto != null ? formDto.mlgDefScore : ''}"
                                   placeholder="10000" min="0" required>
                        </div>

                        <!-- ✅ 핵심역량 체크박스 + 점수 선택 (등록 페이지와 동일) -->
                        <div class="form-item full-width">
                            <label class="form-label required">핵심역량</label>
                            <div class="checkbox-group" id="competencyCheckboxGroup">
                                <!-- Thymeleaf로 동적 생성 -->
                                <div th:each="competency : ${competencies}" class="checkbox-item-wrapper">
                                    <div class="checkbox-item">
                                        <input type="checkbox" 
                                               th:id="'competency_' + ${competency.cclId}" 
                                               name="competencyCheckbox" 
                                               th:value="${competency.cclId}"
                                               th:checked="${formDto != null and formDto.competencyIds != null and #lists.contains(formDto.competencyIds, competency.cclId)}"
                                               onchange="toggleScoreSelect(this)">
                                        <label th:for="'competency_' + ${competency.cclId}" 
                                               th:text="${competency.cclNm}">핵심역량명</label>
                                    </div>
                                    <!-- ✅ 점수 선택 드롭다운 -->
                                    <div class="score-select-wrapper" 
                                         th:id="'score_wrapper_' + ${competency.cclId}" 
                                         th:style="${formDto != null and formDto.competencyIds != null and #lists.contains(formDto.competencyIds, competency.cclId)} ? 'display: block;' : 'display: none;'">
                                        <select th:name="'competencyScore_' + ${competency.cclId}" 
                                                th:id="'score_' + ${competency.cclId}" 
                                                class="score-select">
                                            <option value="" selected>점수를 지정하세요</option>
                                            <option value="15" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 15}">15점</option>
                                            <option value="20" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 20}">20점</option>
                                            <option value="25" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 25}">25점</option>
                                            <option value="30" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 30}">30점</option>
                                            <option value="35" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 35}">35점</option>
                                            <option value="40" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 40}">40점</option>
                                            <option value="45" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 45}">45점</option>
                                            <option value="50" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 50}">50점</option>
                                            <option value="55" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 55}">55점</option>
                                            <option value="60" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 60}">60점</option>
                                            <option value="65" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 65}">65점</option>
                                            <option value="70" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 70}">70점</option>
                                            <option value="75" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 75}">75점</option>
                                            <option value="80" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 80}">80점</option>
                                            <option value="85" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 85}">85점</option>
                                            <option value="90" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 90}">90점</option>
                                            <option value="95" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 95}">95점</option>
                                            <option value="100" th:selected="${formDto != null and formDto.competencyScores != null and formDto.competencyScores.get(competency.cclId) == 100}">100점</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <!-- 기본값들 (competencies가 없을 경우) -->
                                <div th:if="${competencies == null or #lists.isEmpty(competencies)}">
                                    <div class="checkbox-item-wrapper">
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="competency_1" name="competencyCheckbox" value="1" onchange="toggleScoreSelect(this)">
                                            <label for="competency_1">창의적 혁신역량</label>
                                        </div>
                                        <div class="score-select-wrapper" id="score_wrapper_1" style="display: none;">
                                            <select name="competencyScore_1" id="score_1" class="score-select">
                                                <option value="" selected>점수를 지정하세요</option>
                                                <option value="15">15점</option>
                                                <option value="20">20점</option>
                                                <option value="25">25점</option>
                                                <option value="30">30점</option>
                                                <option value="35">35점</option>
                                                <option value="40">40점</option>
                                                <option value="45">45점</option>
                                                <option value="50">50점</option>
                                                <option value="55">55점</option>
                                                <option value="60">60점</option>
                                                <option value="65">65점</option>
                                                <option value="70">70점</option>
                                                <option value="75">75점</option>
                                                <option value="80">80점</option>
                                                <option value="85">85점</option>
                                                <option value="90">90점</option>
                                                <option value="95">95점</option>
                                                <option value="100">100점</option>
                                            </select>
                                        </div>
                                    </div>
                                    <!-- 나머지 기본 핵심역량들... -->
                                </div>
                            </div>
                        </div>

                        <!-- ✅ 설명 (세부사항) -->
                        <div class="form-item full-width">
                            <label class="form-label required">설명 (세부사항)</label>
                            <textarea class="form-textarea" id="prgDesc" name="prgDesc" 
                                      placeholder="프로그램에 대한 상세한 설명을 입력하세요..." required
                                      th:text="${formDto != null ? formDto.prgDesc : ''}"></textarea>
                        </div>
                    </div>

                    <!-- 액션 버튼 -->
                    <div class="action-buttons">
                        <button type="button" class="btn-action btn-preview" onclick="showPreview()">
                            <span class="material-symbols-outlined">visibility</span>
                            미리보기
                        </button>
                        <button type="button" class="btn-action btn-reset" onclick="resetForm()">
                            <span class="material-symbols-outlined">refresh</span>
                            초기화
                        </button>
                        <button type="button" class="btn-action btn-cancel" onclick="cancelForm()">
                            <span class="material-symbols-outlined">close</span>
                            취소
                        </button>
                        <button type="submit" class="btn-action btn-update">
                            <span class="material-symbols-outlined">save</span>
                            수정
                        </button>
                    </div>
                </div>
            </div>
        </form>

        <!-- 미리보기 모달 (등록 페이지와 동일) -->
        <div id="previewModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">프로그램 미리보기</h2>
                    <button class="close" onclick="closePreview()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="preview-container">
                        <div id="previewImage" class="preview-image">
                            대표 사진 미리보기
                        </div>
                        <h3 id="previewTitle" class="preview-title">프로그램명</h3>
                        <div class="preview-info">
                            <div class="preview-item">
                                <span class="preview-label">모집기간</span>
                                <span id="previewRecruitPeriod" class="preview-value">-</span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-label">학년/학점</span>
                                <span class="preview-value">제한없음</span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-label">캠퍼스</span>
                                <span class="preview-value">온라인/전국캠퍼스</span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-label">학과</span>
                                <span class="preview-value">전체 학과</span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-label">운영부서</span>
                                <span id="previewDepartment" class="preview-value">-</span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-label">문의</span>
                                <span id="previewContact" class="preview-value">-</span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-label">마일리지</span>
                                <span id="previewMileage" class="preview-value">0 포인트</span>
                            </div>
                        </div>
                        <div class="preview-description">
                            <h4>세부내용</h4>
                            <div id="previewDescription">프로그램 설명이 여기에 표시됩니다.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
