<!DOCTYPE html>
<html>
<head>
    <title>파일 업로드 테스트</title>
</head>
<body>
    <h1>파일 업로드 테스트</h1>
    
    <form action="/api/admin/noncurr_add" method="post" enctype="multipart/form-data">
        <!-- 텍스트 필드들 -->
        <input type="text" name="prgNm" placeholder="프로그램명" required><br><br>
        
        <!-- 🔥 필수 날짜 필드들 추가 -->
        <label>모집 시작일:</label>
        <input type="date" name="recruitStDt" required><br><br>
        
        <label>모집 마감일:</label>
        <input type="date" name="recruitEndDt" required><br><br>
        
        <label>운영 시작일:</label>
        <input type="date" name="prgStDt" required><br><br>
        
        <label>운영 종료일:</label>
        <input type="date" name="prgEndDt" required><br><br>
        
        <label>만족도조사 마감일:</label>
        <input type="date" name="surveyDt" required><br><br>
        
        <!-- 기타 필수 필드들 -->
        <input type="number" name="maxCnt" placeholder="모집인원" value="30" required><br><br>
        
        <select name="prgDept" required>
            <option value="">운영부서 선택</option>
            <option value="교양학부">교양학부</option>
            <option value="취업지원처">취업지원처</option>
        </select><br><br>
        
        <input type="tel" name="prgTel" placeholder="전화번호" value="02-1234-5678" required><br><br>
        
        <input type="number" name="mlgDefScore" placeholder="마일리지" value="1000" required><br><br>
        
        <textarea name="prgDesc" placeholder="프로그램 설명" required>테스트 설명</textarea><br><br>
        
        <!-- 파일 필드 -->
        <input type="file" name="imageFile" accept="image/*"><br><br>
        
        <!-- 체크박스 -->
        <input type="checkbox" name="competencyIds" value="1"> 역량1<br><br>
        
        <button type="submit">제출</button>
    </form>
</body>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('programForm');
    if (form) {
        form.addEventListener('submit', function(e) {
            console.log('폼 제출됨 - 직접 테스트!');
        });
    }
});
</script>
</html>
