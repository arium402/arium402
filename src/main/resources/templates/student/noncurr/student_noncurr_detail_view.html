<div th:fragment="view">

<main class="col-md-9 col-lg-10 p-0" style="margin-left: 16.66667%; min-height: calc(100vh - 70px); width: 83.33333%;">
	<div class="main-content">
		<!-- 프로그램 상세 -->
		<div class="program-detail">
			<!-- 헤더 영역 -->
				<div class="detail-header">
					<div>
						<a href="#" onclick="goBack()"
							style="color: #666; text-decoration: none; font-size: 1rem;">
							<i class="fas fa-arrow-left me-2"></i>목록으로 돌아가기
						</a>
					</div>

<!-- 신청/취소 버튼들 (수정된 버전) -->
<div class="action-buttons">
    <!-- ✅ 신청하기 버튼 (신청하지 않은 경우) -->
    <button th:if="${program.applicationStatus == 'NOT_APPLIED'}" 
            class="apply-btn-header" 
            th:data-prg-id="${program.prgId}"
            onclick="applyProgramFromButton(this)"
            th:disabled="${!program.canApply}"
            th:text="${program.canApply ? '신청하기' : 
                     (program.currentApplicants >= program.maxCnt ? '정원마감' : 
                      (program.applicationPeriodStatus == 'BEFORE_PERIOD' ? '신청예정' : 
                       (program.applicationPeriodStatus == 'AFTER_PERIOD' ? '신청마감' : '신청불가')))}">
        신청하기
    </button>
    
    <!-- ✅ 신청 불가 이유 표시 (신청하지 않았지만 신청할 수 없는 경우) -->
    <div th:if="${program.applicationStatus == 'NOT_APPLIED' && !program.canApply}" 
         style="color: #6c757d; font-size: 0.9em; margin-top: 5px;">
        <span th:if="${program.currentApplicants >= program.maxCnt}">
            (모집정원 마감)
        </span>
        <span th:if="${program.currentApplicants < program.maxCnt && program.applicationPeriodStatus == 'BEFORE_PERIOD'}">
            (신청기간 시작 전)
        </span>
        <span th:if="${program.currentApplicants < program.maxCnt && program.applicationPeriodStatus == 'AFTER_PERIOD'}">
            (신청기간 종료)
        </span>
    </div>
    
    <!-- ✅ 신청완료 + 신청취소 버튼 (신청한 경우) -->
    <div th:if="${program.applicationStatus == 'APPLIED'}" 
         class="applied-actions" 
         style="display: flex; gap: 10px; align-items: center;">
        
        <!-- 신청완료 상태 표시 (취소 불가 이유 포함) -->
        <span class="applied-status" style="color: #28a745; font-weight: bold;">
            ✓ 신청완료
            <!-- 취소 불가능한 경우 바로 옆에 이유 표시 -->
            <span th:if="${!program.canCancel && !#strings.isEmpty(program.cancelReasonMessage)}" 
                  style="color: #6c757d; font-size: 0.85em; font-weight: normal; margin-left: 8px;">
                [[${program.cancelReasonMessage}]]
            </span>
        </span>
        
        <!-- 취소 가능한 경우만 취소 버튼 표시 -->
        <button th:if="${program.canCancel}" 
                class="cancel-btn-header" 
                th:data-prg-id="${program.prgId}"
                onclick="cancelApplicationFromButton(this)"
                style="background-color: #dc3545; color: white; border: none; padding: 8px 16px; cursor: pointer;">
            신청취소
        </button>
    </div>
</div>
				</div>

				<!-- 프로그램 정보 섹션 -->
				<div class="program-info-section">
					<!-- 프로그램 이미지 -->
					<div class="program-image-container">
						<div th:if="${program.imageUrl != null}">
							<img th:src="${program.imageUrl}" alt="프로그램 이미지"
								style="width: 100%; height: 100%; object-fit: cover;">
						</div>
						<div th:if="${program.imageUrl == null}">
							<i class="fas fa-graduation-cap placeholder-icon"></i>
						</div>
					</div>

					<!-- 프로그램 상세 정보 -->
					<div class="program-details">
						<h1 class="program-title" th:text="${program.prgNm}">진로탐색 및
							자기계발 워크샵</h1>

						<div class="detail-item">
							<span class="detail-label">신청기간:</span> <span
								class="detail-value"
								th:text="${program.recruitStDt + ' ~ ' + program.recruitEndDt}">2024-06-01
								~ 2024-06-15</span>
						</div>

						<div class="detail-item">
							<span class="detail-label">운영기간:</span> <span
								class="detail-value"
								th:text="${program.prgStDt + ' ~ ' + program.prgEndDt}">2024-06-20
								~ 2024-06-22</span>
						</div>

						<div class="detail-item">
							<span class="detail-label">운영부서:</span> <span
								class="detail-value"> <span th:text="${program.prgDept}">학생지원센터</span>
								/ HP: <span th:text="${program.prgTel}">043-820-1234</span>
							</span>
						</div>

						<div class="detail-item">
							<span class="detail-label">마일리지:</span> <span
								class="detail-value mileage-value"
								th:text="${program.mlgDefScore + ' P'}">50 P</span>
						</div>

						<div class="detail-item">
							<span class="detail-label">신청인원:</span> <span
								class="detail-value capacity-value"
								th:text="${program.currentApplicants + '/' + program.maxCnt}"
								th:classappend="${program.currentApplicants >= program.maxCnt} ? 'full' : ''">18/30</span>
						</div>
					</div>
				</div>

				<!-- 핵심역량 그래프 섹션 -->
			<div class="competency-section">
				<h2 class="section-title">핵심역량 지수</h2>
				<div class="competency-charts">
					<!-- 프로그램 핵심역량 지수 -->
					<div class="chart-container">
						<h3 class="chart-title">프로그램 핵심역량 지수</h3>
						<div class="chart-wrapper">
							<canvas id="programCompetencyChart"></canvas>
						</div>
					</div>

					<!-- 나의 역량 지수 -->
					<div class="chart-container">
						<h3 class="chart-title">나의 역량 지수</h3>
						<div class="chart-wrapper">
							<canvas id="myCompetencyChart"></canvas>
						</div>
					</div>
				</div>
			</div>

			<!-- 프로그램 상세 설명 -->
			<div class="description-section">
				<h2 class="section-title">프로그램 상세 설명</h2>
				<div class="program-description">
					<p th:utext="${program.prgDesc}">프로그램 설명이 여기에 표시됩니다.</p>
				</div>
			</div>

		</div>
	</div>
</main>

</div>
