<div th:fragment="view">

	<main class="col-md-9 col-lg-10 p-0"
		style="margin-left: 16.66667%; min-height: calc(100vh - 70px); width: 83.33333%;">
		<div class="main-content">
			<!-- 페이지 헤더 -->
			<div class="page-header">
				<h1 class="page-title">비교과 프로그램</h1>
				<p class="page-subtitle">전체보기</p>
			</div>

			<!-- 검색 & 필터 및 상태 안내 -->
			<div class="filter-status-section">
				<div class="filter-controls">
					<!-- ❌ ID 누락! JavaScript에서 접근 불가 -->
					<input type="text" class="search-input" id="searchKeyword"
						placeholder="프로그램명을 검색하세요...">

					<!-- 필터링을 운영부서로 변경 -->
					<select class="filter-select" id="deptFilter">
						<option value="">전체 운영부서</option>
						<option value="교양학부">교양학부</option>
						<option value="취업지원처">취업지원처</option>
						<option value="정보과학과">정보과학과</option>
						<option value="학생처">학생처</option>
						<option value="창업지원센터">창업지원센터</option>
						<option value="학습지원센터">학습지원센터</option>
						<option value="사회봉사센터">사회봉사센터</option>
						<option value="연구처">연구처</option>
						<option value="컴퓨터과학과">컴퓨터과학과</option>
					</select> <select class="filter-select" id="mileageFilter">
						<option value="">전체 마일리지</option>
						<option value="low">30P 이하</option>
						<option value="mid">31-50P</option>
						<option value="high">51P 이상</option>
					</select> <select class="filter-select" id="statusFilter">
						<option value="">전체 상태</option>
						<option value="available">신청가능</option>
						<option value="closing">마감임박</option>
						<option value="closed">마감</option>
					</select> <select class="filter-select" id="sortBy">
						<option value="">최신순</option>
						<option value="mileage">마일리지순</option>
						<option value="deadline">마감임박순</option>
					</select>
				</div>

				<div class="status-guide">
					<span class="status-guide-title">상태 안내:</span>
					<div class="status-item">
						<span class="status-dot available"></span> <span>신청가능</span>
					</div>
					<div class="status-item">
						<span class="status-dot closing"></span> <span>마감임박</span>
					</div>
					<div class="status-item">
						<span class="status-dot closed"></span> <span>마감</span>
					</div>
				</div>
			</div>

			<!-- 프로그램 그리드 (동적) -->
			<div class="program-grid" id="programGrid">
				<!-- Thymeleaf로 동적 생성 -->
				<div th:each="program : ${programs}" class="program-card">
					<div class="program-image">
						<div class="dday-badge"
							th:classappend="${program.programStatus == 'closed'} ? 'urgent' : (${program.dDay <= 3} ? 'urgent' : (${program.dDay <= 7} ? 'warning' : ''))"
							th:text="${program.dDayText}">D-13</div>
						<div class="status-badge"
							th:classappend="'status-' + ${program.programStatus}"></div>
						<i th:if="${program.imageUrl == null}"
							class="fas fa-graduation-cap placeholder-icon"></i> <img
							th:if="${program.imageUrl != null}" th:src="${program.imageUrl}"
							alt="프로그램 이미지">
					</div>
					<div class="program-content">
						<h3 class="program-title" th:text="${program.prgNm}">프로그램명</h3>
						<div class="program-details">
							<div class="program-dates">
								<div class="date-item">
									<span class="date-label">신청기간:</span> <span class="date-value"
										th:text="${program.recruitStDt + ' ~ ' + program.recruitEndDt}">2024.06.01
										~ 2024.06.15</span>
								</div>
								<div class="date-item">
									<span class="date-label">운영기간:</span> <span class="date-value"
										th:text="${program.prgStDt + ' ~ ' + program.prgEndDt}">2024.06.20
										~ 2024.06.22</span>
								</div>
							</div>
							<div class="program-info">
								<span class="program-points"
									th:text="${program.mlgDefScore + ' P'}">50 P</span> <span
									class="program-capacity"
									th:classappend="${program.currentApplicants >= program.maxCnt} ? 'full' : ''"
									th:text="${program.currentApplicants + '/' + program.maxCnt}">18/30</span>
							</div>
							<button class="apply-btn"
								th:classappend="${program.applicationStatus == 'APPLIED'} ? 'completed' : (${program.programStatus == 'closed'} ? 'disabled' : '')"
								th:disabled="${program.programStatus == 'closed'}"
								th:onclick="'applyProgram(' + ${program.prgId} + ')'"
								th:text="${program.applicationStatus == 'APPLIED'} ? '신청완료' : (${program.programStatus == 'closed'} ? '마감' : '신청하기')">
								신청하기</button>
						</div>
					</div>
				</div>
			</div>

			<!-- 페이지네이션 ID 추가 -->
			<div class="pagination-wrapper">
				<nav aria-label="페이지 네비게이션">
					<ul class="pagination" id="paginationContainer">
						<!-- JavaScript로 동적 생성 -->
					</ul>
				</nav>
			</div>
		</div>
	</main>

</div>
