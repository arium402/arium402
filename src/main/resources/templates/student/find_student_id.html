<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학번 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            border-radius: 0 !important;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .popup-container {
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .popup-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e3c72;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #1e3c72;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #1e3c72;
            outline: none;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #1e3c72;
            color: white;
        }

        .btn-primary:hover {
            background: #2a5298;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .result-section {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border: 2px solid #1e3c72;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 15px;
        }

        .result-content {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            color: #28a745;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="popup-title">학번 찾기</div>
        
        <form id="findStudentIdForm">
            <div class="form-group">
                <label class="form-label">이름</label>
                <input type="text" class="form-control" id="studentName" name="name" placeholder="이름을 입력하세요" required>
                <div class="error-message" id="nameError"></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">전화번호</label>
                <input type="tel" class="form-control" id="studentPhone" name="phone" placeholder="휴대폰 번호를 입력하세요 (예: 010-1234-5678)" required>
                <div class="error-message" id="phoneError"></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" class="form-control" id="studentEmail" name="email" placeholder="이메일을 입력하세요" required>
                <div class="error-message" id="emailError"></div>
            </div>
            
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">학번 찾기</button>
                <button type="button" class="btn btn-secondary" onclick="window.close()">취소</button>
            </div>
        </form>
        
        <div class="result-section" id="resultSection">
            <div class="result-title">학번 찾기 결과</div>
            <div class="result-content" id="resultContent"></div>
            <div class="btn-group">
                <button type="button" class="btn btn-primary" onclick="copyToParent()">로그인 화면에 입력</button>
                <button type="button" class="btn btn-secondary" onclick="window.close()">닫기</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/student/login/find_student_id.js}"></script>
</body>
</html>
