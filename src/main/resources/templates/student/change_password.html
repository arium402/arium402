<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            border-radius: 0 !important;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .popup-container {
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .popup-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e3c72;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #1e3c72;
            padding-bottom: 10px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin: 0 10px;
            position: relative;
        }

        .step.active {
            background: #1e3c72;
            color: white;
        }

        .step.completed {
            background: #28a745;
            color: white;
        }

        .step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 100%;
            width: 20px;
            height: 2px;
            background: #ddd;
            transform: translateY(-50%);
        }

        .step.completed:not(:last-child)::after {
            background: #28a745;
        }

        .step-content {
            display: none;
        }

        .step-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #1e3c72;
            outline: none;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        .form-control:disabled {
            background: #f8f9fa;
            color: #6c757d;
        }

        .contact-method {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .contact-option {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            background: #f8f9fa;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .contact-option.active {
            border-color: #1e3c72;
            background: #1e3c72;
            color: white;
        }

        .verification-group {
            display: flex;
            gap: 10px;
            align-items: end;
        }

        .verification-input {
            flex: 1;
        }

        .verify-btn {
            padding: 12px 20px;
            background: #28a745;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .verify-btn:hover {
            background: #218838;
        }

        .verify-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .timer {
            color: #dc3545;
            font-weight: 600;
            text-align: center;
            margin-top: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #1e3c72;
            color: white;
        }

        .btn-primary:hover {
            background: #2a5298;
        }

        .btn-primary:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .password-requirements {
            background: #f8f9fa;
            padding: 15px;
            margin: 15px 0;
            border-left: 4px solid #1e3c72;
        }

        .password-requirements h6 {
            margin-bottom: 10px;
            color: #1e3c72;
            font-weight: 600;
        }

        .password-requirements ul {
            margin: 0;
            padding-left: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .success-section {
            display: none;
            text-align: center;
            padding: 30px 0;
        }

        .success-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 20px;
        }

        .success-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #28a745;
            margin-bottom: 15px;
        }

        .success-content {
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #1e3c72;
            font-weight: 600;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="popup-title">비밀번호 변경</div>
        
        <div class="step-indicator">
            <div class="step active" id="step1">1</div>
            <div class="step" id="step2">2</div>
            <div class="step" id="step3">3</div>
            <div class="step" id="step4">4</div>
        </div>

        <!-- 1단계: 사용자 정보 입력 -->
        <div class="step-content active" id="step1-content">
            <div class="form-group">
                <label class="form-label">아이디/학번</label>
                <input type="text" class="form-control" id="userId" placeholder="아이디 또는 학번을 입력하세요" required>
                <div class="error-message" id="userIdError"></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" class="form-control" id="userEmail" placeholder="등록된 이메일을 입력하세요" required>
                <div class="error-message" id="emailError"></div>
            </div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-primary" onclick="goToStep2()">다음</button>
                <button type="button" class="btn btn-secondary" onclick="window.close()">취소</button>
            </div>
        </div>

        <!-- 2단계: 인증 방법 선택 -->
        <div class="step-content" id="step2-content">
            <div class="form-group">
                <label class="form-label">인증코드 전송 방법</label>
                <div class="contact-method">
                    <div class="contact-option active" onclick="selectVerificationMethod('phone')">휴대폰</div>
                    <div class="contact-option" onclick="selectVerificationMethod('email')">이메일</div>
                </div>
            </div>
            
            <div class="form-group" id="phone-verification" style="display: block;">
                <label class="form-label">휴대폰 번호</label>
                <input type="tel" class="form-control" id="phoneNumber" placeholder="휴대폰 번호를 입력하세요 (예: 010-1234-5678)">
                <div class="error-message" id="phoneError"></div>
            </div>
            
            <div class="form-group" id="email-verification" style="display: none;">
                <label class="form-label">이메일 확인</label>
                <input type="email" class="form-control" id="verificationEmail" readonly>
            </div>
            
            <div class="loading" id="sendingCode">인증코드를 전송하고 있습니다...</div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-primary" onclick="sendVerificationCode()">인증코드 전송</button>
                <button type="button" class="btn btn-secondary" onclick="goToStep1()">이전</button>
            </div>
        </div>

        <!-- 3단계: 인증코드 입력 -->
        <div class="step-content" id="step3-content">
            <div class="form-group">
                <label class="form-label">인증코드</label>
                <div class="verification-group">
                    <div class="verification-input">
                        <input type="text" class="form-control" id="verificationCode" placeholder="인증코드 6자리를 입력하세요" maxlength="6">
                        <div class="error-message" id="codeError"></div>
                    </div>
                    <button type="button" class="verify-btn" onclick="verifyCode()">확인</button>
                </div>
                <div class="timer" id="timer">05:00</div>
            </div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="resendCode()">재전송</button>
                <button type="button" class="btn btn-secondary" onclick="goToStep2()">이전</button>
            </div>
        </div>

        <!-- 4단계: 새 비밀번호 설정 -->
        <div class="step-content" id="step4-content">
            <div class="password-requirements">
                <h6>비밀번호 설정 조건</h6>
                <ul>
                    <li>8자리 이상 16자리 이하</li>
                    <li>영문 대소문자, 숫자, 특수문자 중 3가지 이상 포함</li>
                    <li>아이디와 동일하거나 포함될 수 없음</li>
                </ul>
            </div>
            
            <div class="form-group">
                <label class="form-label">새 비밀번호</label>
                <input type="password" class="form-control" id="newPassword" placeholder="새 비밀번호를 입력하세요">
                <div class="error-message" id="newPasswordError"></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">새 비밀번호 확인</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="새 비밀번호를 다시 입력하세요">
                <div class="error-message" id="confirmPasswordError"></div>
            </div>
            
            <div class="loading" id="changingPassword">비밀번호를 변경하고 있습니다...</div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-primary" onclick="changePassword()">비밀번호 변경</button>
                <button type="button" class="btn btn-secondary" onclick="goToStep3()">이전</button>
            </div>
        </div>

        <!-- 완료 화면 -->
        <div class="success-section" id="success-section">
            <div class="success-icon">✓</div>
            <div class="success-title">비밀번호 변경 완료</div>
            <div class="success-content">
                비밀번호가 성공적으로 변경되었습니다.<br>
                새로운 비밀번호로 다시 로그인해주세요.
            </div>
            <button type="button" class="btn btn-primary" onclick="window.close()">확인</button>
        </div>
    </div>
     <script th:src="@{/js/student/login/change_password.js}"></script>
</body>
</html>
